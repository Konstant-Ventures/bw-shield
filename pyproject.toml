[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secret-gate"
description = "Python interface to Bitwarden Secrets Manager for environment variable management"
version = "1.0.0"
authors = [
    {name = "Hector Sanchez", email = "hector.sanchez@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
keywords = ["bitwarden", "auth", "secrets", "environment", "variables", "terminal", "cli"]
dependencies = []

[project.scripts]
secret-gate = "secret_gate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Konstant-Ventures/secret-gate"
Documentation = "https://github.com/Konstant-Ventures/secret-gate/blob/main/README.md"
Issues = "https://github.com/Konstant-Ventures/secret-gate/issues"
"Source Code" = "https://github.com/Konstant-Ventures/secret-gate/tree/main"
